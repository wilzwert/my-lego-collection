services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\Auth\Domain\:
        resource: '../../src/Auth/Domain/'
        exclude:
            - '../../src/Auth/Domain/Event'
            - '../../src/Auth/Domain/Exception'
            - '../../src/Auth/Domain/Model'

    App\Auth\Application\:
        resource: '../../src/Auth/Application/'
        exclude:
            - '../../src/Auth/Application/Command'

    App\Auth\Infrastructure\:
        resource: '../../src/Auth/Infrastructure/'
        exclude:
            - '../../src/Auth/Infrastructure/Dto'
            - '../../src/Auth/Infrastructure/Persistence/Doctrine/Entity'
            - '../../src/Auth/Infrastructure/Security/User'

    # each slice may provide, if needed, a middleware to convert DomainEvent to IntegrationEvent
    # and then dispatch to the integration bus
    # if not middleware is provided then a DomainEvent shouldn't be handled by an external handler
    auth.integration_event_middleware:
        class: App\Auth\Infrastructure\Messenging\AuthIntegrationEventMiddleware
        tags:
            - { name: messenger.middleware, bus: auth.bus }

    _instanceof:
        # All services implementing the IntegrationEventHandler interface
        # in the auth slice must use only the auth.bus
        App\Shared\Infrastructure\EventHandler\DomainEventHandler:
            tags:
                - { name: messenger.message_handler, bus: auth.bus }

    # we have to  manually pass the right EventBus because other slices may create other EventBuses
    App\Auth\Domain\Service\DefaultIdentityService:
        arguments:
            $eventBus: '@App\Auth\Infrastructure\Messenging\AuthEventBus'
