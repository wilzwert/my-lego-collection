framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        default_bus: integration.bus

        buses:
            command.bus:
                middleware:
                    - dispatch_after_current_bus
                    - doctrine_transaction

            integration.bus:
                default_middleware:
                    enabled: true

            auth.bus:
                default_middleware:
                    enabled: true

            user.bus:
                default_middleware:
                    enabled: true

            collection-management.bus:
                default_middleware:
                    enabled: true

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourM': async
            'MyLegoCollection\SharedEvent\Event\IntegrationEvent': async
            'MyLegoCollection\SharedEvent\Command\Command': async


            # it's important the CreateUserCommand is handled synchronously by the User slice
            'MyLegoCollection\SharedEvent\Command\CreateUserCommand': sync

            # it's important the UserCreatedIntegrationEvent is handled synchronously by the Auth slice

            'MyLegoCollection\SharedEvent\Event\UserCreatedIntegrationEvent': sync



