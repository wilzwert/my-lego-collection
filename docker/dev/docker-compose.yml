services:
  app:
    build:
      context: ../..
      dockerfile: docker/dev/frankenphp/Dockerfile
    container_name: mylego_collection_app
    volumes:
      - ../../back:/app:cached
    environment:
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - POSTGRES_HOST=db
      - POSTGRES_DB=symfony
      - POSTGRES_USER=symfony
      - POSTGRES_PASSWORD=secret
      - REDIS_HOST=redis
    ports:
      - "8080:80"   # FrankenPHP
    depends_on:
      - db
      - redis
    networks:
      - mylego_collection_net

  db:
    image: postgres:16
    container_name: mylego_collection_db
    environment:
      POSTGRES_DB: symfony
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - mylego_collection_net

  redis:
    image: redis:7
    container_name: mylego_collection_redis
    ports:
      - "6379:6379"
    networks:
      - mylego_collection_net

volumes:
  db_data:
  
networks:
  mylego_collection_net:
    driver: bridge